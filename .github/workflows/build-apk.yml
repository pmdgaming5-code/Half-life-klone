name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: JavaScript syntax check
        run: npm run check
      - name: Build web app
        run: npm run build
      - name: Create Android project
        run: npx cap add android
      - name: Force Android landscape orientation
        run: node scripts/patch-android.js
      - name: Sync Android project
        run: npx cap sync android
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Verify APK and landscape manifest
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          grep -q 'android:screenOrientation="landscape"' android/app/src/main/AndroidManifest.xml
      - name: Upload APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: resonance-blacksite-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
